name: CI

# Every push and every pull request. The database tests run against an
# in-memory Postgres (PGlite) built from the migrations in this repo, so CI
# needs no Supabase credentials at all — and must never be given any for the
# production project.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, format and tests
        run: npm run check

      - name: Database, RLS and function tests
        run: npm run db:test

      # The build needs a Supabase URL only so the generated _headers can name
      # an origin in the Content-Security-Policy. These are placeholders: no
      # real project is contacted, and nothing is deployed from here.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Scan the bundle for secrets
        run: npm run check:build-secrets

      - name: Check the generated security headers
        run: |
          test -f dist/_headers || { echo "dist/_headers was not generated"; exit 1; }
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "ci-placeholder.supabase.co" dist/_headers
          test -f dist/_redirects || { echo "dist/_redirects is missing"; exit 1; }
          echo "Headers and redirects present."

      - name: Upload the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
